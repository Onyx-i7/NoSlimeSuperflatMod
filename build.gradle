buildscript {
    repositories {
        mavenCentral()
        maven { 
            name = "Forge Maven"
            url = "https://maven.minecraftforge.net/" 
        }
        maven { 
            name = "Files Minecraft"
            url = "https://files.minecraftforge.net/maven" 
        }
        maven { 
            name = "Architectury"
            url = "https://maven.architectury.dev/" 
        }
        maven { 
            name = "Minecraft Libraries"
            url = "https://libraries.minecraft.net/" 
        }
        maven { 
            name = "SpongePowered"
            url = "https://repo.spongepowered.org/maven/" 
        }
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
    }
}

plugins {
    id 'java'
}

apply plugin: 'net.minecraftforge.gradle'

// =============================================================================
// MOD CONFIGURATION
// =============================================================================

version = "1.3.0"
group = "com.onyxi7.noslimesuperflat"
archivesBaseName = "NoSlimeSuperflat-1.16.5"

// Java 8 compatibility for Minecraft 1.16.5
java.toolchain.languageVersion = JavaLanguageVersion.of(8)
compileJava.options.encoding = 'UTF-8'

minecraft {
    mappings channel: 'official', version: '1.16.5'
    
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            mods {
                noslimesuperflat {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            mods {
                noslimesuperflat {
                    source sourceSets.main
                }
            }
        }
    }
}

// =============================================================================
// REPOSITORIES
// =============================================================================

repositories {
    mavenCentral()
    maven { 
        name = "Forge Maven"
        url = "https://maven.minecraftforge.net/" 
    }
    maven { 
        name = "Files Minecraft"
        url = "https://files.minecraftforge.net/maven" 
    }
    maven { 
        name = "Architectury"
        url = "https://maven.architectury.dev/" 
    }
}

// =============================================================================
// DEPENDENCIES
// =============================================================================

dependencies {
    minecraft 'net.minecraftforge:forge:1.16.5-36.2.39'
    // No external dependencies - lightweight mod design
}

// ... código anterior ...

// =============================================================================
// RESOURCE PROCESSING
// =============================================================================

processResources {
    inputs.property "version", project.version

    filesMatching('META-INF/mods.toml') {
        expand 'version': project.version
    }
}

// =============================================================================
// JAR CONFIGURATION
// =============================================================================

jar {
    manifest {
        attributes([
            'Specification-Title': 'noslimesuperflat',
            'Specification-Vendor': 'onyxi7',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'onyxi7',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'Built-On': new Date().format('yyyy-MM-dd HH:mm:ss'),
            'Built-With': "Gradle ${gradle.gradleVersion}"
        ])
    }
}

// =============================================================================
// BUILD TASKS
// =============================================================================

build.dependsOn jar

// Custom task to verify build outputs
task verifyBuild {
    doLast {
        println "Build verification complete"
        println "Mod ID: noslimesuperflat"
        println "Version: ${version}"
        println "Minecraft: 1.16.5"
        println "Forge: 36.2.39"
    }
}

build.finalizedBy verifyBuild
